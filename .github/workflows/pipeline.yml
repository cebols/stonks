name: data-pipeline

# Atualiza trades + preços + track record diariamente.
#
# Único secret obrigatório no repo (Settings → Secrets and variables → Actions):
#   SUPABASE_SERVICE_ROLE_KEY  — a chave service_role secreta do Supabase.
# A URL do Supabase e as URLs das fontes têm default abaixo; sobrescreva-as
# criando repo Variables de mesmo nome se um dia mudarem.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC todo dia
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://rtjbqcdinhvezzvopitq.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SENATE_TRADES_URL: ${{ vars.SENATE_TRADES_URL || 'https://raw.githubusercontent.com/timothycarambat/senate-stock-watcher-data/master/aggregate/all_transactions.json' }}
      HOUSE_TRADES_URL: ${{ vars.HOUSE_TRADES_URL || 'https://raw.githubusercontent.com/pastrosd/Congress-Trades/main/House.json' }}
      PRICE_BENCHMARK_TICKER: ${{ vars.PRICE_BENCHMARK_TICKER || 'SPY' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - name: Ingest trades
        run: npm run ingest
      - name: Fetch prices
        run: npm run fetch-prices
      - name: Compute performance
        run: npm run compute-performance
